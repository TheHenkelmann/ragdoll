version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      cargo-patches:
        update-types:
          - "minor"
          - "patch"
      cargo-majors:
        update-types:
          - "major"
    ignore:
      # jsonwebtoken 11 requires base64 ^0.22
      - dependency-name: "base64"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      pip-patches:
        update-types:
          - "minor"
          - "patch"
      pip-majors:
        update-types:
          - "major"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm-patches:
        update-types:
          - "minor"
          - "patch"
      npm-majors:
        update-types:
          - "major"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
