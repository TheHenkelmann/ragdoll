services:
  ragdoll:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      RAGDOLL_DATA_DIR: /data
      RAGDOLL_SECRET: ${RAGDOLL_SECRET:-change-me-in-production}
      # RAGDOLL_SECRET_OLD: ${RAGDOLL_SECRET_OLD:-}  # only during secret rotation
      RUST_LOG: info,ragdoll=debug
    volumes:
      - ragdoll-data:/data

volumes:
  ragdoll-data:
